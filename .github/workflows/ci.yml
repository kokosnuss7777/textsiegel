# Tests on every push; on main additionally the Docker image (ghcr.io) and the check page (GitHub Pages).
# The VPS pulls the image itself (systemd timer, see deploy/) – GitHub needs no access to the VPS.
name: CI and deployment

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser

  image:
    if: github.event_name == 'push'
    needs: [test, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Repository variables: where the check page sends requests, and who operates the service.
      SERVICE_URL: ${{ vars.SERVICE_URL }}
      PROVIDER_NAME: ${{ vars.PROVIDER_NAME }}
      CONTACT: ${{ vars.CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp server/check.html _site/index.html
          cp server/about.html _site/about.html
          cp spec/test-vectors.json _site/test-vectors.json
          node -e 'const e = process.env; process.stdout.write("window.TEXTSIEGEL = " + JSON.stringify({ api: e.SERVICE_URL || "", provider: e.PROVIDER_NAME || "", contact: e.CONTACT || "" }) + ";\n")' > _site/config.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
